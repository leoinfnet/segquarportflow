spring:
  application:
    name: terminal-service
  mongodb:
    uri: mongodb://terminal_service:terminal_service@localhost:27017/terminal_service

server:
  port: 9081

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoint:
    web:
      exposure: health,info